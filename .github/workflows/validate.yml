name: validate

# Syntax-gate the committed configs and PowerShell scripts. These files are symlinked live on a
# workstation, so this is the safety net that keeps a broken config from ever reaching main.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install YAML and TOML parsers
        shell: pwsh
        # Without these, Test-WinDotfilesConfig reports yasb/config.yaml and starship.toml as
        # skipped rather than checked — the gate silently passes on files it never parsed.
        run: |
          Install-Module powershell-yaml -Force -Scope CurrentUser -AllowClobber
          Install-Module PSToml -Force -Scope CurrentUser -AllowClobber

      - name: Validate configs and PowerShell parse
        shell: pwsh
        run: ./powershell/Test-WinDotfiles.ps1 -ConfigOnly
