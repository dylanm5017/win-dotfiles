# win-dotfiles Starship prompt, tuned for WezTerm with a Nerd Font. Two lines: location, git state
# and anything worth noticing on the first, the input on the second. The `theme` command flips the
# active `palette` line below to recolor the prompt in lock-step with the terminal, window manager,
# and desktop. Starship reads this file directly via $env:STARSHIP_CONFIG.
add_newline = true
command_timeout = 500
scan_timeout = 10

# Active palette — rewritten by `theme set <name>` (themes/<name>.psd1 StarshipPalette).
palette = "gruvbox"

# An explicit list, so a module only appears here once it has been restyled below.
format = """
$directory\
$git_branch\
$git_state\
$git_status\
$status\
$cmd_duration\
$package\
$nodejs\
$deno\
$bun\
$python\
$dotnet\
$rust\
$golang\
$java\
$lua\
$line_break\
$character"""

[directory]
style = "bold accent"
read_only = " ro"
read_only_style = "muted"
format = "[$path]($style)[$read_only]($read_only_style)  "

[git_branch]
style = "text"
format = "[$symbol$branch(:$remote_branch)]($style)  "

[git_state]
style = "warn"
format = '[\($state( $progress_current/$progress_total)\)]($style)  '

# Icons are Nerd Font codepoints. Each type carries its own color, and stashes are left out of the
# format on purpose: a long-lived stash list says nothing about the work in front of you.
[git_status]
style = "warn"
format = "([$conflicted$staged$modified$renamed$typechanged$deleted$untracked$ahead_behind]($style) )"
conflicted = "[\uf071 ${count}](bold err) "
staged = "[\uf00c ${count}](ok) "
modified = "[\uf040 ${count}](warn) "
renamed = "[\uf061 ${count}](warn) "
typechanged = "[\uf0ec ${count}](warn) "
deleted = "[\uf014 ${count}](err) "
untracked = "[\uf128 ${count}](muted) "
ahead = "[\uf062 ${count}](accent) "
behind = "[\uf063 ${count}](accent) "
diverged = "[\uf062 ${ahead_count} \uf063 ${behind_count}](accent) "
[status]
disabled = false
style = "bold err"
symbol = "✗"
format = "[$symbol $status]($style)  "

[cmd_duration]
style = "muted"
format = "[$duration]($style)  "

[package]
style = "muted"
symbol = "pkg "
version_format = "${raw}"
format = "[$symbol$version]($style)  "

[nodejs]
style = "muted"
symbol = "node "
version_format = "${raw}"
format = "[$symbol($version)]($style)  "

[deno]
style = "muted"
symbol = "deno "
version_format = "${raw}"
format = "[$symbol($version)]($style)  "

[bun]
style = "muted"
symbol = "bun "
version_format = "${raw}"
format = "[$symbol($version)]($style)  "

[python]
style = "muted"
symbol = "py "
version_format = "${raw}"
format = '[$symbol($version)( \($virtualenv\))]($style)  '

[dotnet]
style = "muted"
symbol = ".NET "
version_format = "${raw}"
format = "[$symbol($version)]($style)  "

[rust]
style = "muted"
symbol = "rust "
version_format = "${raw}"
format = "[$symbol($version)]($style)  "

[golang]
style = "muted"
symbol = "go "
version_format = "${raw}"
format = "[$symbol($version)]($style)  "

[java]
style = "muted"
symbol = "java "
version_format = "${raw}"
format = "[$symbol($version)]($style)  "

[lua]
style = "muted"
symbol = "lua "
version_format = "${raw}"
format = "[$symbol($version)]($style)  "

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold err)"
vimcmd_symbol = "[❮](bold accent)"

# Per-theme palettes, one per themes/<name>.psd1: accent is its Accent, and text, muted and warn are
# its YasbPalette text, subtext and warn. `theme <name>` selects one by rewriting the `palette` line.
[palettes.mocha]   # Catppuccin Mocha
accent = "#cba6f7"
text = "#cdd6f4"
muted = "#a6adc8"
warn = "#f9e2af"
ok = "#a6e3a1"     # green
err = "#f38ba8"    # red

