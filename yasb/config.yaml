# win-dotfiles Yasb (Yet Another Status Bar) config — primary status bar (replaces the
# komorebi built-in bar). Linked to ~/.config/yasb/config.yaml by winsmooth -Apply.
#
# Two asymmetric bars:
#   - light  -> primary monitor (Samsung ultrawide): ambient glance (workspaces, clock, media).
#   - rich   -> the other monitor (ASUS 1080p detail screen): full system widgets + tray + power.
# Yasb targets them by name-independent screen tokens: ['primary'] vs ['*'] (remaining monitor).
#
# Theming is NOT done here: colors live in yasb/styles.css inside a win-dotfiles:theme block
# that the `theme` command rewrites from the active palette (themes/<name>.psd1 -> YasbPalette),
# keeping the bar in lock-step with the terminal, prompt, komorebi borders, and desktop accent.
#
# Komorebi workspace/layout widgets require komorebi >= v0.18.0.

watch_stylesheet: true   # hot-reload styles.css on save (so `theme` repaints live)
watch_config: true       # hot-reload this file on save
debug: false
show_systray: false
system_colors: false     # palette is driven explicitly via styles.css :root, not the OS accent

komorebi:
  start_command: "komorebic start --whkd"
  stop_command: "komorebic stop --whkd"
  # reload-configuration only reloads legacy .ahk/.ps1 configs; a static komorebi.json needs
  # replace-configuration, so the old value here was a silent no-op.
  reload_command: "komorebic replace-configuration C:\\Workspace\\Projects\\win-dotfiles\\komorebi\\komorebi.json"

bars:
  # Light, ambient bar on the primary Samsung ultrawide.
  # Notifications live here (not the rich bar) because Windows opens the notification
  # center on the primary screen, so the bell sits next to where the panel appears.
  light-bar:
    enabled: true
    screens: ['primary']
    class_name: "yasb-bar light-bar"
    alignment: { position: "top", align: "center" }
    # Blur off: the strip itself is transparent in this style and each widget group is its
    # own opaque pill, so a blurred band behind them would defeat the floating look.
    blur_effect: { enabled: false, round_corners: false }
    animation: { enabled: true, type: "slide", duration: 320 }
    # No AppBar: komorebi reserves the strip via global_work_area_offset (komorebi.json),
    # so tiled windows never sit under the bar. Two reservations would double-stack.
    window_flags: { always_on_top: true, windows_app_bar: false }
    dimensions: { width: "100%", height: 38 }
    padding: { top: 6, left: 8, bottom: 0, right: 8 }
    widgets:
      # Each entry below renders as its own floating pill (see styles.css); Groupers exist
      # purely to put several widgets inside one shared pill.
      # Time is pinned far left so it never moves: the centre island is media only, and media
      # comes and goes as music starts and stops. Date lives on the clock's alt label
      # (right-click) and in the calendar popup, not as a second always-on field.
      left: ["clock", "nav_group"]
      center: ["media"]
      right: ["sound_group", "dev_group"]

  # Rich, detail bar on the smaller ASUS 1080p screen (compact labels to fit 1920px).
  rich-bar:
    enabled: true
    screens: ['*']
    class_name: "yasb-bar rich-bar"
    alignment: { position: "top", align: "center" }
    blur_effect: { enabled: false, round_corners: false }
    animation: { enabled: true, type: "slide", duration: 320 }
    # No AppBar: komorebi reserves the strip via global_work_area_offset (komorebi.json),
    # so tiled windows never sit under the bar. Two reservations would double-stack.
    window_flags: { always_on_top: true, windows_app_bar: false }
    dimensions: { width: "100%", height: 38 }
    padding: { top: 6, left: 8, bottom: 0, right: 8 }
    widgets:
      # Mirrors the light bar: clock pinned far left, and the centre island is the volatile
      # thing — here the komorebi stack rather than now-playing.
      left: ["clock", "komorebi_workspaces"]
      center: ["komorebi_stack"]
      right: ["weather", "system_grouper", "tray_group"]

widgets:
  # ---- Pill islands -----------------------------------------------------------------------
  # Groupers are used here as *visual* containers, not collapsible panels: they let several
  # widgets share one pill instead of each floating alone. collapse_options is disabled so no
  # chevron button appears (unlike system_grouper, which is genuinely collapsible).
  nav_group:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "nav-group"
      widgets: ["home", "komorebi_workspaces", "komorebi_active_layout"]
      collapse_options: { enabled: false }

  sound_group:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "sound-group"
      widgets: ["cava", "volume"]
      collapse_options: { enabled: false }

  dev_group:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "dev-group"
      widgets: ["github", "claude_usage", "todo", "notifications"]
      collapse_options: { enabled: false }

  tray_group:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "tray-group"
      # theme_status moved here from the dev island: it is an appearance/system control, not a
      # dev signal, and this is the bar's system cluster.
      widgets: ["dnd", "theme_status", "systray", "power_menu"]
      collapse_options: { enabled: false }

  komorebi_workspaces:
    type: "komorebi.workspaces.WorkspaceWidget"
    options:
      label_offline: "komorebi offline"
      label_workspace_btn: "{name}"
      label_workspace_active_btn: "{name}"
      label_workspace_populated_btn: "{name}"
      hide_empty_workspaces: true
      hide_if_offline: false
      # Icons only, no names. Empty workspaces are hidden anyway, so every visible chip has
      # icons to identify it, and the app icons say more at a glance than the name did.
      # The name is still in the hover tooltip.
      app_icons:
        enabled_populated: true
        enabled_active: true
        size: 16
        max_icons: 4
        hide_duplicates: true
        hide_label: true

  komorebi_active_layout:
    type: "komorebi.active_layout.ActiveLayoutWidget"
    options:
      hide_if_offline: true
      label: "{icon}"
      layouts:
        ['bsp', 'columns', 'rows', 'grid', 'scrolling', 'vertical_stack',
         'horizontal_stack', 'ultrawide_vertical_stack', 'right_main_vertical_stack']
      # Written as \u escapes and each one verified to render in CaskaydiaCove NF. Every icon
      # except grid was previously an empty string — the private-use glyphs had been lost in an
      # encoding round-trip, so the layout indicator only ever appeared on the grid layout.
      layout_icons:
        bsp: "\uf0e8"                        # tree / binary partition
        columns: "\uf0db"
        rows: "\uf00b"
        grid: "\U000F0758"
        scrolling: "\U000F04E1"
        vertical_stack: "\U000F0570"         # main pane + stack
        horizontal_stack: "\uf009"
        ultrawide_vertical_stack: "\uf00a"
        right_main_vertical_stack: "\U000F060E"
        monocle: "\uf065"
        maximized: "\uf2d0"
        floating: "\uf2d2"
        paused: "\uf04c"
        tiling: "\U000F08A5"
      callbacks:
        on_left: "next_layout"
        on_middle: "toggle_tiling"
        on_right: "prev_layout"

  komorebi_control:
    type: "komorebi.control.KomorebiControlWidget"
    options:
      label: "<span></span>"
      komorebi_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        alignment: "left"
        direction: "down"
      callbacks:
        on_left: "toggle_menu"

  # Replaces the old active_window widget on the rich bar: the workspace app-icons already say
  # what is running, so a single focused title was redundant. This lists every window in the
  # focused stack and switches between them on click / scroll.
  komorebi_stack:
    type: "komorebi.stack.StackWidget"
    options:
      label_offline: ""
      label_window: "{process}"
      label_window_active: "{title}"
      label_no_window: ""
      show_icons: "always"
      icon_size: 14
      max_length: 12
      max_length_active: 36
      max_length_ellipsis: "..."
      hide_if_offline: true
      enable_scroll_switching: true
      rewrite:
        - pattern: "^(.+?)\\.exe$"
          replacement: "\\1"
          case: "title"

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M}"
      label_alt: "{%A, %d %B}"   # right-click swaps to the date; calendar popup has the rest
      update_interval: 1000
      calendar:
        blur: true
        round_corners: true
        alignment: "left"        # clock is pinned far left, so the popup hangs left
        direction: "down"

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "<span></span> {title} - {artist}"
      label_alt: "<span></span> {title}"
      hide_empty: true
      max_field_size:
        label: 40
        label_alt: 28
      # Thumbnail off in the bar: yasb paints the album art *behind* the label, which reads as
      # a blotchy patch beside the clock. The media popup still shows it at 240px.
      show_thumbnail: false
      thumbnail_padding: 6
      thumbnail_corner_radius: 6
      controls_hide: true
      icons:
        prev_track: ""
        next_track: ""
        play: ""
        pause: ""
      media_menu_icons:
        prev_track: ""
        next_track: ""
        play: ""
        pause: ""
        unmute: ""
      # Scrolling is off in the centre island: the marquee's paint region bled under the clock
      # beside it, and static truncated text reads better next to a fixed-width time anyway.
      scrolling_label:
        enabled: false
        update_interval_ms: 33
      media_menu:
        round_corners: true
        round_corners_type: "normal"
        alignment: "center"
        thumbnail_corner_radius: 12   # round the album art (popup-specific)
        thumbnail_size: 240
        max_title_size: 48
        max_artist_size: 34
        show_source: true
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "toggle_play_pause"
        on_right: "toggle_label"

  weather:
    type: "yasb.open_meteo.OpenMeteoWidget"
    options:
      # Keyless Open-Meteo. Set your location once via the weather-card search on first open.
      units: "imperial"   # °F / mph
      label: "<span>{icon}</span> {temp}"
      label_alt: "{location}: min {min_temp} max {max_temp}, humidity {humidity}"
      hide_decimal: true
      update_interval: 1800
      callbacks:
        on_left: "toggle_card"
        on_right: "toggle_label"

  # System stats grouped into one frosted, collapsible island.
  system_grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "system-grouper"
      # update_check lives in here rather than the tray island so the winget/scoop counts are
      # behind the collapse instead of permanently on the bar — they are a "when I go looking"
      # signal, not an ambient one. This grouper starts collapsed.
      widgets: ["cpu", "memory", "gpu", "disk", "traffic", "update_check"]
      hide_empty: false
      collapse_options:
        enabled: true
        # Chevron on the LEFT edge of this pill. On the right it landed next to the systray's
        # own collapse chevron in the neighbouring pill, so the two read as one control.
        label_position: "left"

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: " {info[percent][total]}%"
      label_alt: " {info[freq][current]} MHz"
      update_interval: 2000
      cpu_thresholds: { low: 25, medium: 60, high: 85 }
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      menu: { enabled: true, show_graph: true, show_graph_grid: true, graph_history_size: 60 }

  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: " {virtual_mem_percent}%"
      label_alt: " {virtual_mem_free}/{virtual_mem_total}"
      update_interval: 5000
      memory_thresholds: { low: 25, medium: 60, high: 85 }
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      menu: { enabled: true, show_graph: true, show_graph_grid: true, graph_history_size: 60 }

  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "<span></span> {info[utilization]}%"
      label_alt: "<span></span> {info[temp]}°C {info[power_draw]}W"
      update_interval: 2000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      menu: { enabled: true, show_graph: true, show_graph_grid: true, graph_history_size: 60 }

  disk:
    type: "yasb.disk.DiskWidget"
    options:
      label: "<span></span> {space[used][percent]}"
      label_alt: "<span></span> {space[used][gb]} / {space[total][gb]}"
      volume_label: "C"
      update_interval: 60
      disk_thresholds: { low: 25, medium: 60, high: 85 }
      group_label: { round_corners_type: "normal" }
      callbacks:
        on_left: "toggle_group"
        on_middle: "toggle_label"
        on_right: "exec explorer C:\\"

  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "  {download_speed}  {upload_speed}"
      label_alt: " {download_speed}  {upload_speed}"
      update_interval: 1000
      hide_decimal: true
      callbacks:
        on_left: "toggle_menu"

  update_check:
    type: "yasb.update_check.UpdateCheckWidget"
    options:
      winget_update:
        enabled: true
        interval: 60                 # re-check hourly (default is 240) so it refreshes
        exclude: ["Microsoft.Edge"]
        label: "<span></span> {count}"
      scoop_update:
        enabled: true
        interval: 60                 # match winget
        label: "<span>󰔮</span> {count}"
      windows_update:
        enabled: false

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      audio_menu:
        round_corners: true
        round_corners_type: "normal"
        show_apps: true
        show_app_icons: true
      callbacks:
        on_left: "toggle_volume_menu"
        on_right: "toggle_mute"

  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span></span> {count}"
      callbacks:
        on_left: "toggle_notification"
        on_middle: "toggle_label"
        on_right: "do_nothing"

  dnd:
    type: "yasb.dnd.DndWidget"
    options:
      label: "{icon}"
      label_alt: "{icon} {status}"
      icons:
        disabled: "󰖔"   # off — crescent moon (quiet hours available), shown dim
        priority: ""    # on, priority only — filled moon
        alarms: ""      # on, alarms only — bell-slash (notifications silenced)
      callbacks:
        on_left: "toggle_status"
        on_right: "cycle_status"

  # On-brand: reads the win-dotfiles active theme slug (themes/active.txt). Updates within ~5s of
  # a `theme` switch. Left-click opens a palette-styled theme picker (tools/Show-ThemePicker.ps1)
  # that applies the chosen theme live. NOTE: hard-codes the repo path; change it if the repo moves.
  theme_status:
    type: "yasb.custom.CustomWidget"
    options:
      class_name: "theme-status"
      label: "<span></span> {data}"
      exec_options:
        run_cmd: 'cmd /c type C:\Workspace\Projects\win-dotfiles\themes\active.txt'
        return_format: "string"
        run_interval: 5000
        use_shell: false
      callbacks:
        # Launched via wscript (GUI host) so pwsh starts with no console window flash.
        on_left: "exec wscript C:\\Workspace\\Projects\\win-dotfiles\\tools\\Show-ThemePicker.vbs"

  cava:
    type: "yasb.cava.CavaWidget"
    options:
      class_name: "cava-widget"
      bar_type: "bars"
      orientation: "bottom"
      sleep_timer: 5
      hide_empty: true
      callbacks:
        on_right: "reload_cava"

  # ---- Dev widgets (light-bar): GitHub notifications, Claude Code quota ----
  # Icon-only labels to stay compact on the ambient bar; right-click toggles the verbose alt.
  # (A VS Code recents widget was tried but removed: YASB queries the legacy
  #  history.recentlyOpenedPathsList key, which current VS Code no longer writes.)
  github:
    type: "yasb.github.GithubWidget"
    options:
      label: "<span></span> {data}"               # {data} = unread notification count
      label_alt: "<span></span> Notifications {data}"
      token: ""                                          # OAuth browser sign-in on first run
      max_notification: 20
      only_unread: false
      notification_dot:
        enabled: true
        corner: "bottom_right"
        color: "red"
        margin: [1, 1]
      update_interval: 300                               # seconds
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6

  claude_usage:
    type: "yasb.claude_usage.ClaudeUsageWidget"
    options:
      label: "<span>󰉹</span> {five_hour}%"          # 5-hour window utilization
      label_alt: "<span>󰉹</span> 7d {seven_day}%"   # 7-day window utilization
      update_interval: 60                                # seconds (schema range 30-3600)
      cache_ttl: 120
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"

  # Scratch task list. Tasks live in ~/.config/yasb/todo.json (not this repo) — deliberately
  # unversioned, since it is ephemeral and can carry client names. See the public/NDA rule.
  todo:
    type: "yasb.todo.TodoWidget"
    options:
      label: "<span></span> {count}"
      label_alt: "<span></span> {count}/{total}"
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        alignment: "right"
        direction: "down"
        offset_top: 6
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"

  # Single leading menu button, replacing a four-icon launcher strip. Two adjacent clusters of
  # small icons — launchers, then workspace app-icons — read as one undifferentiated row, so the
  # launchers collapse into one glyph and their targets move into this popup.
  home:
    type: "yasb.home.HomeWidget"
    options:
      label: "<span></span>"        # hamburger
      menu_list:
        - { title: "WezTerm", command: "wezterm-gui" }
        # Single-quoted: YAML treats backslashes literally there, so Windows paths need no escaping.
        - { title: "VS Code", command: 'C:\Program Files\Microsoft VS Code\Code.exe' }
        - { separator: true }
        - { title: "Projects", path: 'C:\Workspace\Projects' }
        - { title: "Home", path: "~" }
        - { title: "Downloads", path: '~\Downloads' }
        - { separator: true }
        - { title: "Windows Settings", uri: "ms-settings:" }
      system_menu: true
      power_menu: false                   # power lives on the rich bar; keep this bar quiet
      blur: true
      round_corners: true
      round_corners_type: "normal"
      alignment: "left"
      direction: "down"
      offset_top: 6

  # Real Windows tray, folded into the rich bar's trailing island. Unpinned icons live behind
  # a popup grid so the strip stays a fixed width; alt+click an icon to pin/unpin it.
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      # Ellipsis rather than a chevron, and on the right edge: the stats grouper next door
      # uses chevrons for its own collapse, and two adjacent chevrons read as one control.
      # An ellipsis also says "more icons" more clearly than an arrow does.
      label_collapsed: ""   # ellipsis-h
      label_expanded: ""    # chevron-right
      label_position: "right"
      icon_size: 16
      pin_click_modifier: "alt"
      show_unpinned: false
      show_unpinned_button: true
      show_in_popup: true
      icons_per_row: 6
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        alignment: "right"
        direction: "down"
        offset_top: 6

  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: ""
      menu_style: "popup"
      buttons:
        lock: ["", "Lock"]
        sleep: ["2", "Sleep"]
        signout: ["󰍃", "Sign out"]
        restart: ["", "Restart"]
        shutdown: ["", "Shut Down"]
        cancel: ["󰜺", "Cancel"]
